<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Employee | CA Office</title>

    <link
        rel="stylesheet"
        href="/CSS/style.css"
    >

</head>


<body class="dashboard-body">


<div class="dashboard-layout">


    <aside class="sidebar">

        <div class="sidebar-brand">

            <div class="logo-mark">
                CA
            </div>

            <div class="brand-name">

                <strong>
                    CA Office
                </strong>

                <span>
                    Administration
                </span>

            </div>

        </div>


        <nav class="sidebar-nav">

            <span class="nav-section">
                OVERVIEW
            </span>

            <a
                href="/admin/dashboard.html"
                class="nav-item"
            >
                <span class="nav-icon">
                    ⌂
                </span>

                Dashboard
            </a>


            <span class="nav-section">
                MANAGEMENT
            </span>


            <a
                href="/admin/employees.html"
                class="nav-item active"
            >

                <span class="nav-icon">
                    ◌
                </span>

                Employees

            </a>


            <a
                href="/client/clients.html"
                class="nav-item"
            >

                <span class="nav-icon">
                    ◉
                </span>

                Clients

            </a>


            <a
                href="/admin/tasks.html"
                class="nav-item"
            >

                <span class="nav-icon">
                    ✓
                </span>

                Tasks

            </a>


            <a
                href="/admin/signup-requests.html"
                class="nav-item"
            >

                <span class="nav-icon">
                    ◌
                </span>

                Signup Requests

            </a>

        </nav>


        <div class="sidebar-bottom">

            <button
                id="logoutButton"
                class="logout-button"
                type="button"
            >

                <span class="nav-icon">
                    ↪
                </span>

                Sign out

            </button>

        </div>

    </aside>



    <main class="dashboard-main">


        <header class="dashboard-header">

            <div>

                <span class="dashboard-eyebrow">
                    EMPLOYEE MANAGEMENT
                </span>

                <h1>
                    Add employee
                </h1>

                <p>
                    Create an employee account directly from the administrator panel.
                </p>

            </div>

        </header>



        <section class="dashboard-panel">


            <div class="panel-header">

                <div>

                    <h2>
                        Employee information
                    </h2>

                    <p>
                        Login credentials will be created immediately.
                    </p>

                </div>

            </div>


            <form
                id="addEmployeeForm"
                class="task-form"
            >


                <div class="form-grid">


                    <div class="form-group">

                        <label>
                            First name
                        </label>

                        <input
                            type="text"
                            id="firstName"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Middle name
                            <span class="optional">
                                Optional
                            </span>
                        </label>

                        <input
                            type="text"
                            id="middleName"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Last name
                        </label>

                        <input
                            type="text"
                            id="lastName"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Designation
                        </label>

                        <input
                            type="text"
                            id="designation"
                            placeholder="e.g. Accountant"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Contact number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            minlength="4"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            minlength="8"
                            required
                        >

                    </div>


                </div>


                <div
                    id="employeeMessage"
                    class="task-success-message"
                ></div>


                <button
                    type="submit"
                    class="primary-button task-submit-button"
                >
                    Create employee
                </button>


            </form>


        </section>


    </main>


</div>


<script src="/JS/auth.js"></script>

<script src="/JS/add-employee.js"></script>


</body>

</html>
