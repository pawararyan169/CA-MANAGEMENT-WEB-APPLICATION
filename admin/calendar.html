<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CA Office Management - Calendar and To-Do List">
    <title>Calendar & To-Do | CA Office</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/CSS/style.css">

    <style>
        .calendar-page {
            width: 100%;
            max-width: 1500px;
            margin: 0 auto;
        }

        .calendar-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        .calendar-toolbar-left,
        .calendar-toolbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .calendar-title {
            min-width: 210px;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
        }

        .calendar-nav-button,
        .today-button {
            height: 40px;
            padding: 0 14px;
            border: 1px solid #e5e7eb;
            border-radius: 9px;
            background: #fff;
            color: #111827;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .calendar-nav-button:hover,
        .today-button:hover {
            background: #f8fafc;
        }

        .calendar-layout {
            display: grid;
            grid-template-columns: minmax(0, 1.7fr) minmax(320px, .8fr);
            gap: 18px;
        }

        .calendar-panel,
        .todo-panel {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            overflow: hidden;
        }

        .calendar-weekdays,
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
        }

        .calendar-weekday {
            padding: 12px 10px;
            background: #f8fafc;
            border-bottom: 1px solid #e5e7eb;
            color: #6b7280;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            text-align: center;
        }

        .calendar-day {
            min-height: 115px;
            padding: 9px;
            border-right: 1px solid #eef2f7;
            border-bottom: 1px solid #eef2f7;
            cursor: pointer;
            transition: background .15s ease;
        }

        .calendar-day:nth-child(7n) {
            border-right: 0;
        }

        .calendar-day:hover {
            background: #f8fafc;
        }

        .calendar-day.other-month {
            background: #fafafa;
            color: #9ca3af;
        }

        .calendar-day.selected {
            background: #eff6ff;
        }

        .calendar-day.today .day-number {
            background: #111827;
            color: #fff;
        }

        .day-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
        }

        .day-todos {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 7px;
        }

        .day-todo {
            padding: 4px 6px;
            border-radius: 5px;
            background: #f1f5f9;
            color: #334155;
            font-size: 10px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .day-todo.completed {
            opacity: .55;
            text-decoration: line-through;
        }

        .todo-header {
            padding: 18px;
            border-bottom: 1px solid #e5e7eb;
        }

        .todo-header h2 {
            margin: 0;
            font-size: 18px;
        }

        .todo-header p {
            margin: 5px 0 0;
            color: #6b7280;
            font-size: 13px;
        }

        .todo-form {
            display: grid;
            gap: 10px;
            padding: 16px;
            border-bottom: 1px solid #e5e7eb;
        }

        .todo-form input,
        .todo-form select {
            width: 100%;
            height: 40px;
            padding: 0 11px;
            box-sizing: border-box;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: #fff;
            font: inherit;
            color: #111827;
            outline: none;
        }

        .todo-form input:focus,
        .todo-form select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,.10);
        }

        .todo-add-button {
            height: 40px;
            border: 0;
            border-radius: 8px;
            background: #111827;
            color: #fff;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .todo-add-button:hover {
            background: #1f2937;
        }

        .todo-filters {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            border-bottom: 1px solid #e5e7eb;
        }

        .todo-filter {
            flex: 1;
            height: 34px;
            border: 1px solid #e5e7eb;
            border-radius: 7px;
            background: #fff;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
        }

        .todo-list {
            max-height: 590px;
            overflow-y: auto;
            padding: 8px;
        }

        .todo-item {
            display: grid;
            grid-template-columns: 24px minmax(0, 1fr) auto;
            align-items: center;
            gap: 9px;
            padding: 11px 9px;
            border-radius: 9px;
        }

        .todo-item:hover {
            background: #f8fafc;
        }

        .todo-check {
            width: 17px;
            height: 17px;
            cursor: pointer;
        }

        .todo-content {
            min-width: 0;
        }

        .todo-text {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #111827;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .todo-item.completed .todo-text {
            color: #9ca3af;
            text-decoration: line-through;
        }

        .todo-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 4px;
        }

        .todo-badge {
            padding: 3px 6px;
            border-radius: 5px;
            background: #f1f5f9;
            color: #475569;
            font-size: 9px;
            font-weight: 700;
        }

        .todo-badge.high {
            background: #fee2e2;
            color: #991b1b;
        }

        .todo-badge.medium {
            background: #fef3c7;
            color: #92400e;
        }

        .todo-badge.low {
            background: #dcfce7;
            color: #166534;
        }

        .todo-delete {
            width: 30px;
            height: 30px;
            border: 0;
            border-radius: 7px;
            background: transparent;
            color: #9ca3af;
            cursor: pointer;
            font-size: 16px;
        }

        .todo-delete:hover {
            background: #fee2e2;
            color: #b91c1c;
        }

        .todo-empty {
            padding: 35px 15px;
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
        }

        @media (max-width: 1100px) {
            .calendar-layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 700px) {
            .calendar-toolbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .calendar-toolbar-left,
            .calendar-toolbar-right {
                width: 100%;
            }

            .calendar-title {
                flex: 1;
            }

            .calendar-day {
                min-height: 85px;
                padding: 5px;
            }

            .day-todo {
                font-size: 9px;
            }
        }
    </style>
</head>

<body class="dashboard-body">

<div class="dashboard-layout">

    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="logo-mark">CA</div>
            <div class="brand-name">
                <strong>CA Office</strong>
                <span>Administration</span>
            </div>
        </div>

        <nav class="sidebar-nav"></nav>

        <div class="sidebar-bottom">
            <button type="button" class="logout-button" id="logoutButton">
                <span class="nav-icon">↪</span>
                <span>Sign out</span>
            </button>
        </div>
    </aside>

    <main class="dashboard-main">

        <header class="dashboard-header">
            <div>
                <span class="dashboard-eyebrow">OFFICE</span>
                <h1>Calendar & To-Do</h1>
                <p>Plan daily work, track deadlines and manage your personal to-do list.</p>
            </div>
        </header>

        <div class="calendar-page">

            <div class="calendar-toolbar">
                <div class="calendar-toolbar-left">
                    <button type="button" class="calendar-nav-button" id="previousMonth">←</button>
                    <button type="button" class="calendar-nav-button" id="nextMonth">→</button>
                    <div class="calendar-title" id="calendarTitle"></div>
                </div>

                <div class="calendar-toolbar-right">
                    <button type="button" class="today-button" id="todayButton">Today</button>
                </div>
            </div>

            <div class="calendar-layout">

                <section class="calendar-panel">

                    <div class="calendar-weekdays">
                        <div class="calendar-weekday">Sun</div>
                        <div class="calendar-weekday">Mon</div>
                        <div class="calendar-weekday">Tue</div>
                        <div class="calendar-weekday">Wed</div>
                        <div class="calendar-weekday">Thu</div>
                        <div class="calendar-weekday">Fri</div>
                        <div class="calendar-weekday">Sat</div>
                    </div>

                    <div class="calendar-grid" id="calendarGrid"></div>

                </section>

                <section class="todo-panel">

                    <div class="todo-header">
                        <h2>To-Do List</h2>
                        <p id="selectedDateLabel">Tasks for today</p>
                    </div>

                    <form class="todo-form" id="todoForm">

                        <input
                            type="text"
                            id="todoText"
                            placeholder="What needs to be done?"
                            maxlength="200"
                            required
                        >

                        <input
                            type="date"
                            id="todoDate"
                            required
                        >

                        <select id="todoPriority">
                            <option value="medium">Medium priority</option>
                            <option value="high">High priority</option>
                            <option value="low">Low priority</option>
                        </select>

                        <button type="submit" class="todo-add-button">
                            + Add To-Do
                        </button>

                    </form>

                    <div class="todo-filters">
                        <button type="button" class="todo-filter" data-filter="all">All</button>
                        <button type="button" class="todo-filter" data-filter="open">Open</button>
                        <button type="button" class="todo-filter" data-filter="completed">Done</button>
                    </div>

                    <div class="todo-list" id="todoList"></div>

                </section>

            </div>

        </div>

    </main>

</div>

<script src="/JS/auth.js"></script>
<script src="/JS/unified-sidebar.js"></script>
<script src="/JS/calendar.js"></script>

</body>
</html>
