<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clients | CA Office</title>

    <link rel="stylesheet" href="../CSS/style.css">

    <style>
        .client-page {
            padding: 38px 44px;
        }

        .client-page-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 28px;
        }

        .client-page-header h1 {
            font-size: 30px;
            letter-spacing: -0.035em;
        }

        .client-page-header p {
            margin-top: 7px;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .client-search {
            width: 280px;
            height: 42px;
            padding: 0 13px;

            border: 1px solid var(--border);
            border-radius: 8px;

            background: white;
            color: var(--text);

            outline: none;
            font-family: var(--font);
            font-size: 12px;
        }

        .client-search:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(49, 91, 131, 0.08);
        }

        .client-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .client-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .client-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            padding: 20px;

            border-bottom: 1px solid var(--border);
        }

        .client-name-area {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .client-avatar {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #edf2f6;
            color: #42637e;

            font-size: 13px;
            font-weight: 700;
        }

        .client-name-area h2 {
            font-size: 15px;
        }

        .client-name-area span {
            display: block;
            margin-top: 4px;

            color: var(--text-muted);
            font-size: 10px;
        }

        .client-type {
            padding: 6px 10px;

            border-radius: 20px;

            background: #f1f4f7;
            color: #42637e;

            font-size: 9px;
            font-weight: 700;
        }

        .client-information {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;

            padding: 20px;
        }

        .client-field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .client-field.full {
            grid-column: 1 / -1;
        }

        .client-field-label {
            color: var(--text-muted);
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .client-field-value {
            color: var(--text);
            font-size: 11px;
            line-height: 1.5;
            word-break: break-word;
        }

        .client-section {
            grid-column: 1 / -1;

            margin-top: 5px;
            padding-top: 17px;

            border-top: 1px solid var(--border);

            color: var(--text);
            font-size: 11px;
            font-weight: 700;
        }

        .empty-client {
            padding: 70px 20px;

            text-align: center;

            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .empty-client strong {
            display: block;
            font-size: 13px;
        }

        .empty-client span {
            display: block;
            margin-top: 7px;

            color: var(--text-muted);
            font-size: 10px;
        }

        .client-error {
            padding: 13px;

            display: none;

            margin-bottom: 18px;

            border: 1px solid #ffd5d5;
            border-radius: 8px;

            background: var(--error-bg);
            color: var(--error);

            font-size: 11px;
        }

        @media (max-width: 1000px) {
            .client-information {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 700px) {
            .client-page {
                padding: 25px 18px;
            }

            .client-page-header {
                flex-direction: column;
                gap: 18px;
            }

            .client-search {
                width: 100%;
            }

            .client-information {
                grid-template-columns: 1fr;
            }

            .client-field.full {
                grid-column: auto;
            }

            .client-section {
                grid-column: auto;
            }

            .client-card-header {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body class="dashboard-body">

<div class="dashboard-layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-brand">

            <div class="logo-mark">
                CA
            </div>

            <div class="brand-name">
                <strong>CA Office</strong>
                <span>Management System</span>
            </div>

        </div>


        <nav class="sidebar-nav">

            <div class="nav-section">
                MAIN
            </div>

            <a
                href="/employee/dashboard.html"
                class="nav-item"
            >
                <span class="nav-icon">⌂</span>
                Dashboard
            </a>

            <a
                href="/client/clients.html"
                class="nav-item active"
            >
                <span class="nav-icon">◉</span>
                Clients
            </a>

            <a
                href="/employee/tasks.html"
                class="nav-item"
            >
                <span class="nav-icon">✓</span>
                My Work
            </a>

        </nav>


        <div class="sidebar-bottom">

            <button
                class="logout-button"
                id="logoutButton"
            >
                <span class="nav-icon">↪</span>
                Logout
            </button>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="dashboard-main">

        <div class="client-page">

            <div class="client-page-header">

                <div>

                    <span class="dashboard-eyebrow">
                        CLIENT MANAGEMENT
                    </span>

                    <h1>Clients</h1>

                    <p>
                        View client information maintained by the CA office.
                    </p>

                </div>


                <input
                    type="search"
                    id="clientSearch"
                    class="client-search"
                    placeholder="Search clients..."
                >

            </div>


            <div
                id="clientError"
                class="client-error"
            ></div>


            <div
                id="clientList"
                class="client-list"
            ></div>

        </div>

    </main>

</div>


<script src="../JS/auth.js"></script>
<script src="../JS/client-clients.js"></script>

</body>
</html>
